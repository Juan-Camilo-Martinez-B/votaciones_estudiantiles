services:
  # ========================================================
  # Base de Datos PostgreSQL
  # ========================================================
  postgres:
    image: postgres:16-alpine
    container_name: votaciones-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: votaciones_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d votaciones_db"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - votaciones-net

  # ========================================================
  # Base de Datos MySQL
  # ========================================================
  mysql:
    image: mysql:8.4
    container_name: votaciones-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: votaciones_db
      MYSQL_USER: votaciones
      MYSQL_PASSWORD: votaciones
      MYSQL_ROOT_PASSWORD: root
    ports:
      # 3307 en el host: el 3306 ya lo ocupa el MySQL instalado en Windows.
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - votaciones-net

  # ========================================================
  # Broker de Mensajería RabbitMQ (Dependencia AMQP)
  # ========================================================
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: votaciones-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"    # Puerto AMQP
      - "15672:15672"  # Panel de administración Web (http://localhost:15672)
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - votaciones-net

volumes:
  postgres_data:
    driver: local
  mysql_data:
    driver: local
  rabbitmq_data:
    driver: local

networks:
  votaciones-net:
    driver: bridge
