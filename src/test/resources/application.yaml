spring:
  application:
    name: votaciones-test

  datasource:
    url: jdbc:h2:mem:votaciones_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false

  rabbitmq:
    listener:
      simple:
        auto-startup: false
