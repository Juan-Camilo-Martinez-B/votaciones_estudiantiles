spring:
  application:
    name: votaciones

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/votaciones_db}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}

server:
  port: ${PORT:8080}

academic-mock:
  cantidad-estudiantes: ${ACADEMIC_MOCK_CANTIDAD_ESTUDIANTES:12000}
  prefijo-codigo: ${ACADEMIC_MOCK_PREFIJO_CODIGO:2024}
  latencia-ms: ${ACADEMIC_MOCK_LATENCIA_MS:0}
